model:
  architecture: swin_unetr
  # Path to a .pt weights file for learned PET lesion segmentation.
  # When null, the pipeline falls back to PERCIST 1.0 SUV-threshold detection.
  custom_pet_weights_path: null
  # SwinUNETR architecture hyperparameters — must match the trained checkpoint.
  in_channels: 2           # 2 = [SUV, CT_HU] dual-channel; 1 = SUV only
  out_channels: 2          # 2 = softmax (background + lesion); 1 = sigmoid binary
  feature_size: 48         # SwinUNETR hidden feature size (24/36/48/96)
  use_checkpoint: false    # gradient checkpointing (saves VRAM, slower training)

inference:
  device: auto             # "cuda" | "cpu" | "auto" (prefer CUDA if available)
  # Sliding-window inference params (match training roi_size)
  roi_size: [96, 96, 96]
  sw_batch_size: 1
  overlap: 0.5
  mode: gaussian           # "gaussian" | "constant" (window blending)
  # DL output threshold: sigmoid/softmax class-1 probability above this → lesion
  dl_lesion_threshold: 0.5

  # Fallback PERCIST threshold params (used when custom_pet_weights_path is null)
  percist_liver_factor: 1.5
  suv_threshold_absolute: 2.5
  # Detection threshold source for CALIBRATED SUV studies (drives which voxels
  # become "detected lesions" — i.e. the cyan outlines in the fused viewer).
  #   "liver_mean" — case-adaptive: threshold = calibrated_liver_factor * the
  #                  study's own liver SUVmean reference (physiologic background),
  #                  so detection scales with each patient's normal liver uptake.
  #   "absolute"   — fixed suv_threshold_absolute (e.g. SUV 2.5) for every case.
  # Falls back to suv_threshold_absolute when no liver reference is available.
  calibrated_threshold_source: liver_mean   # "liver_mean" | "absolute"
  calibrated_liver_factor: 1.5              # detection threshold = factor * liver SUVmean
  # Tumor-positive/negative call cutoff when calibrated_threshold_source is
  # "liver_mean": a focus is called positive when SUVmax > factor * liver SUVmean.
  # Raise above calibrated_liver_factor to make the positive call stricter than
  # detection (e.g. detect at 1.0x liver, call positive only above 1.5x liver).
  diagnosis_liver_factor: 1.5
  # Reference SUV regions (liver / aortic blood pool) via TotalSegmentator instead
  # of the HU-box heuristic, which averages generic soft tissue and under-reads the
  # liver. Falls back to the heuristic per-organ if segmentation is unavailable.
  reference_organ_segmentation: true
  # When SUV calibration is absent (no patient weight / injected dose in the PET
  # DICOM header), pixel values are RELATIVE-normalised intensities — not true
  # SUV — so the absolute SUV threshold above is meaningless and lights up a
  # large fraction of the body. In that case detection switches to the
  # liver-relative PERCIST threshold and the result is flagged non-quantitative.
  uncalibrated_use_relative_threshold: true
  min_lesion_volume_ml: 2.0
  # Upper sanity bound: a single connected focus larger than max_lesion_volume_ml
  # OR larger than max_lesion_volume_fraction of the whole imaged volume is not a
  # plausible lesion — it means the suppression stages failed to break up diffuse
  # uptake (typical of uncalibrated data with no CT). Such foci are dropped and a
  # QA flag is raised rather than reported as a giant "tumour".
  max_lesion_volume_ml: 500.0
  max_lesion_volume_fraction: 0.10
  suv_peak_sphere_radius_mm: 6.204

  # Name each detected focus by the anatomical structure it occupies (reuses
  # TotalSegmentator) so the report reads "FDG-avid focus in the liver" instead of
  # a coarse "Upper Abdomen", and foci in physiologic/excretory structures
  # (kidney/bladder) are flagged. Best-effort: falls back to the Z-region label
  # when no co-registered CT is available. Adds one segmentation pass.
  # Anatomic lesion size from the original CT: PET-seeded, bounded region-grow
  # around each focus → longest/short diameter (cm). Falls back to the metabolic
  # extent (SUV grid) when the CT boundary is not trustworthy (non-soft-tissue
  # seed, leak, or the segment reaches the ROI border). An estimate, not a
  # validated tumour segmenter — dimensions are labelled by source in the report.
  ct_lesion_measurement:
    enabled: true
    roi_margin_mm: 20.0     # bounded ROI around the focus (keeps region-grow local)
    hu_tolerance: 40.0      # grow within seed HU ± this (soft-tissue homogeneity)
    min_seed_hu: -50.0      # skip air/lung-density foci (region-grow meaningless)
    max_seed_hu: 150.0      # skip bone/calcium-dominant foci
    max_roi_fill_frac: 0.6  # reject if the grown segment fills >60% of the ROI (leak)
    max_leak_factor: 20.0   # loose backstop: reject if grown volume > 20× metabolic
    min_seg_voxels: 8       # reject specks; a segment spanning the full ROI = leak

  structure_labeling:
    enabled: true
    # Use TotalSegmentator's 3 mm model (--fast): ~5-10x faster than the default
    # 1.5 mm model (which dominates pipeline runtime at ~7-8 min). The coarser masks
    # are more than adequate here — reference-organ ROIs are eroded, the exclusion
    # mask is dilated, and lesion naming only needs the containing structure.
    fast: true
    # Extra (free, Apache-2.0) TotalSegmentator tasks merged into the naming map
    # for anatomy the `total` task lacks. Each extra task's labels are painted ONLY
    # where `total` found background (see _segment_structures_multilabel), so only
    # tasks covering anatomy `total` does NOT segment add value — a task that
    # overlaps an organ `total` already labels (e.g. lung_vessels / lung_nodules,
    # which sit inside the already-labeled lung lobes) is a no-op here and only
    # costs one extra native-resolution segmentation pass per run. Do NOT add
    # `body`: it would paint every unlabeled soft-tissue voxel as a generic "body"
    # label, which is worse than the Z-region "soft-tissue site" fallback.
    #   breasts                    — breast tissue (absent from `total`)
    #   pleural_pericard_effusion  — pleural/pericardial fluid (background in
    #                                `total`); malignant effusions can be FDG-avid
    #   hip_implant                — metal implants (absent from `total`); flags
    #                                implant-related uptake
    #   head_glands_cavities       — parotid/submandibular glands, nasal cavity,
    #                                naso/oro/hypopharynx, soft/hard palate (absent
    #                                from `total`). Without this, physiologic
    #                                salivary-gland and nasal-mucosa uptake — a
    #                                classic false-positive source — surfaces as an
    #                                unexplained "Brain"/"Head/Neck" Z-region focus
    #                                with no organ name; this names it so the
    #                                report reads "parotid_gland_left" instead.
    # Empty list to skip. Note each task listed here adds one segmentation pass.
    extra_tasks:
      - breasts
      - pleural_pericard_effusion
      - hip_implant
      - head_glands_cavities
    # Minimum fraction of a focus that must lie inside one segmented organ before
    # the focus is named after it. Tumour tissue is not itself segmented, so a mass
    # in unlabeled space that only clips an organ edge would otherwise be mislabeled
    # by that minority overlap (e.g. a retroperitoneal mass tagged "iliopsoas" from
    # an ~11% psoas clip). Below this, the focus is reported by region as a
    # "soft-tissue site" instead of a specific organ.
    min_organ_coverage: 0.5

  # ── Physiologic FDG suppression (reduces false positives from normal uptake) ──
  # Anatomy-aware: segments organs on the co-registered CT with TotalSegmentator
  # and excludes their voxels from threshold-based detection. Falls back to the
  # coarse geometric brain/thyroid/bladder mask when CT or TotalSegmentator is
  # unavailable. Only applied to threshold detection — a trained DL model is
  # trusted to discriminate physiologic uptake on its own.
  physiologic_suppression:
    enabled: true
    # Always cap the superior brain_frac (postprocessing.exclude_brain_top_frac) of the
    # volume regardless of which suppression path ran. At --fast resolution the
    # TotalSegmentator brain mask can undersegment at the margins, letting residual
    # cerebral FDG uptake survive as a spurious "brain" lesion. Whole-body FDG-PET only;
    # set false for dedicated head/neck acquisitions where the vertex is diagnostic.
    brain_geometric_backstop: true
    totalseg_task: total
    totalseg_weights_dir: /model_cache/totalsegmentator
    dilate_voxels: 2
    # Organs whose physiologic / excretory FDG uptake is excluded from detection.
    # Conservative default (high-uptake, low primary-tumour-risk sites). Add
    # liver / spleen / stomach / small_bowel / colon if bowel or hepatic false
    # positives dominate — but note that excluding an organ also hides any true
    # lesion located within it.
    exclude_organs:
      - brain
      - heart
      - urinary_bladder
      - kidney_left
      - kidney_right

  # ── CT concordance: reject foci with no soft-tissue correlate (e.g. bowel gas) ──
  ct_concordance:
    enabled: true
    min_mean_hu: -150.0    # reject a focus whose mean CT HU is air/gas
    air_hu: -200.0
    max_air_fraction: 0.5  # reject if > this fraction of the focus is air voxels

preprocessing:
  # Normalisation applied before DL inference
  clip_suv_max: 20.0       # SUV clipped to [0, clip_suv_max] → divided by clip_suv_max → [0,1]
  clip_ct_min: -1000.0     # HU clip range → (HU - clip_ct_min) / (clip_ct_max - clip_ct_min) → [0,1]
  clip_ct_max: 1000.0

  pet_series_patterns:
    - "(?i)\\bpt\\b"
    - "(?i)\\bpet\\b"
    - "(?i)emission"
    - "(?i)fdg"
    - "(?i)wholebody"
  ct_series_patterns:
    - "(?i)\\bct\\b"
    - "(?i)attenuation"
    - "(?i)transmission"
    - "(?i)low.*dose"
    - "(?i)scout"
  f18_half_life_seconds: 6586.2

postprocessing:
  generate_mip: true
  generate_fused: true
  mip_colormap: hot
  liver_hu_min: 40
  liver_hu_max: 80
  mediastinum_hu_min: 20
  mediastinum_hu_max: 55

quality_checks:
  min_slices: 100
  max_expected_suv: 50.0
  warn_on_missing_calibration: true
