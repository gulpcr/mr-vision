name: ct_chest
version: "1.0.0"
description: >
  Chest CT screening by a local MedGemma vision-language model in TWO passes (whole-volume scan to flag abnormal levels, then a free-text report on the flagged levels) across lung, mediastinal and bone windows. Requires medgemma_enabled. NON-DIAGNOSTIC assistive output.
supported_body_parts:
  - CHEST
  - THORAX
required_sequences:
  - CT
model_type: MedGemma (local VLM) two-pass full-volume anomaly scan + free-text report
enabled: true
