# ct_brain configuration (CT-report family). No learned model: the whole diagnostic
# volume is rendered slice-by-slice and MedGemma decides which slices are abnormal in a
# first pass, then reports only on the flagged slices in a second pass. Windows below are
# tuned for this body region. Measurement (SAM-Med3D) is enabled but unvalidated for this region.
preprocessing:
  edge_trim_fraction: 0.05
  min_foreground_fraction: 0.05
  max_scan_slices: 64
  out_size: 768
  preview_count: 6
  # Region-appropriate series selection (multi-series studies). TAG-FIRST: match DICOM
  # BodyPartExamined (0018,0015) against body_part_tags; fall back to SeriesDescription
  # regexes (series_patterns) since BodyPartExamined is DICOM Type 3 (optional) and often
  # blank. Falls back to the largest non-scout series (+ series_region_unmatched QA flag).
  body_part_tags:
    - HEAD
    - BRAIN
    - SKULL
  series_patterns:
    - "(?i)brain"
    - "(?i)\\bhead\\b"
    - "(?i)cranium"
  # HU windows each scanned slice is rendered in (one PNG per slice x window).
  windows:
    - {name: brain, level: 40.0, width: 80.0}
    - {name: blood, level: 60.0, width: 200.0}
    - {name: bone, level: 500.0, width: 2500.0}

scan:
  # Windows scanned in the first (anomaly-flagging) pass. Subset of preprocessing.windows.
  scan_windows:
    - brain
    - blood
    - bone
  batch_size: 2
  # MedGemma model tag for this use case (27B is more sensitive for the scan pass).
  model: "medgemma:27b"

report:
  # HU windows of the flagged slices sent to the second (reporting) pass.
  windows:
    - brain
    - blood
    - bone
  max_report_levels: 5

# Tumour measurement (SAM-Med3D + TotalSegmentator organ-exclusion), enabled 2026-09-17
# for GPU-capacity testing. The localization heuristic is the same generic HU-threshold +
# organ-exclusion method used by abdomen_ct (see usecases/<name>/measurement.py) — it was
# NOT re-tuned or re-validated for this body region's anatomy. Non-blocking (any failure
# just omits a measurement), but treat sizes from this region as unvalidated estimates.
measurement:
  enabled: true

quality_checks:
  min_slices: 10
