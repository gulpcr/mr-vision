# ct_neck is MANUAL-ONLY: the rule below is disabled so auto-classification never
# selects it. The two-pass full-volume MedGemma scan is expensive (many model calls per
# study), so it is opt-in — run it explicitly by passing usecase_names=["ct_neck"] to
# POST /api/studies/{uid}/jobs. Flip `enabled: true` to allow auto-routing (the rule is
# already scoped to CT + this region).
rules:
  - modality: CT
    body_parts:
      - NECK
    study_description_patterns:
      - "(?i)neck"
      - "(?i)cervical\\s*soft"
      - "(?i)thyroid"
      - "(?i)larynx"
      - "(?i)nasopharynx"
      - "(?i)oropharyn"
      - "(?i)tongue"
      - "(?i)oral\\s*cavity"
      - "(?i)tonsil"
    priority: 5
    enabled: false
