# abdomen_ct4 is MANUAL-ONLY: the rule below is disabled so auto-classification never
# selects it. The two-stage two-model engine loads a 4B multimodal AND a 27B text model
# and triages the whole volume — expensive — so it is opt-in. Run it explicitly by
# passing usecase_names=["abdomen_ct4"] to POST /api/studies/{uid}/jobs (the
# orchestrator bypasses routing for explicit use-case names).
#
# To enable auto-routing, flip `enabled: true` — the rule is already scoped to CT +
# abdomen/pelvis so it will only match relevant studies.
rules:
  - modality: CT
    body_parts:
      - ABDOMEN
      - PELVIS
    study_description_patterns:
      - "(?i)abdomen"
      - "(?i)abdo"
      - "(?i)\\bpelvis\\b"
      - "(?i)\\bkub\\b"
      - "(?i)liver"
    series_description_patterns:
      - "(?i)abdomen"
      - "(?i)portal"
      - "(?i)venous"
    priority: 5
    enabled: false
