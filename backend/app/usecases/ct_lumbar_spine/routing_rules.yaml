# ct_lumbar_spine is MANUAL-ONLY: the rule below is disabled so auto-classification never
# selects it. The two-pass full-volume MedGemma scan is expensive (many model calls per
# study), so it is opt-in — run it explicitly by passing usecase_names=["ct_lumbar_spine"] to
# POST /api/studies/{uid}/jobs. Flip `enabled: true` to allow auto-routing (the rule is
# already scoped to CT + this region).
rules:
  - modality: CT
    body_parts:
      - LSPINE
      - SPINE
    study_description_patterns:
      - "(?i)lumbar"
      - "(?i)\\bl-?spine\\b"
      - "(?i)lumbosacral"
      - "(?i)\\bls\\s*spine\\b"
    priority: 5
    enabled: false
