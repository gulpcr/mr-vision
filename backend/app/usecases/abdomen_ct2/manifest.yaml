name: abdomen_ct2
version: "1.0.0"
description: >
  Abdomen CT screening by a local MedGemma vision-language model in TWO passes, with
  NO pre-selection of slices, NO segmentation and NO measurement. Pass 1: the whole
  diagnostic CT volume is rendered slice-by-slice and fed to MedGemma in batches until
  every slice has been reviewed; MedGemma flags the levels that look potentially
  abnormal. Pass 2: only the flagged levels are sent back to MedGemma, which identifies
  the anatomy and authors a free-text radiological report on them. Requires
  medgemma_enabled (local Ollama). Differs from abdomen_ct, which pre-samples a few
  levels instead of scanning the whole volume. NON-DIAGNOSTIC assistive output —
  full-volume radiologist review remains required.
supported_body_parts:
  - ABDOMEN
  - PELVIS
required_sequences:
  - CT
model_type: MedGemma (local VLM) two-pass full-volume anomaly scan + free-text report
enabled: true
