# abdomen_ct configuration. There is no learned model. Unlike abdomen_ct (which
# samples a few axial levels up front), abdomen_ct renders the WHOLE diagnostic
# volume and lets MedGemma itself decide which slices are abnormal in a first pass,
# then reports only on the flagged slices in a second pass. These knobs govern how
# many slices are rendered/scanned, how they are batched to MedGemma, and which HU
# windows are used.
preprocessing:
  # Fraction of the volume trimmed off each end before scanning (extreme top/bottom
  # slices are usually partial anatomy / table artifact).
  edge_trim_fraction: 0.05
  # Skip near-empty (air/table) slices so they are never scanned or reported: a slice
  # is kept only if at least this fraction of pixels are tissue (HU > -500).
  min_foreground_fraction: 0.05
  # Hard cap on the number of slices scanned per study (bounds MedGemma calls and
  # latency). If the foreground slice count exceeds this, an evenly-strided subset of
  # this size is scanned instead (logged). Raise for finer coverage at higher cost.
  # 96 keeps inter-slice gaps small enough (~a few slices) that a focal finding lands
  # on at least one scanned level anywhere in the abdomen/pelvis.
  max_scan_slices: 96
  # Long-edge output size for each rendered PNG (px); 0 keeps native resolution.
  out_size: 768
  # Number of representative slices always rendered as artifacts (so the UI shows
  # something even when MedGemma is disabled or flags nothing).
  preview_count: 6

  # Region-appropriate series selection (multi-series studies). TAG-FIRST: match the
  # DICOM BodyPartExamined (0018,0015) tag against body_part_tags; fall back to
  # SeriesDescription regexes (series_patterns) because BodyPartExamined is DICOM Type 3
  # (optional) and is blank on many scanners (incl. this deployment's). Falls back to the
  # largest non-scout series (with a series_region_unmatched QA flag) when neither matches.
  body_part_tags:
    - ABDOMEN
    - PELVIS
    - ABDOMENPELVIS
  series_patterns:
    - "(?i)abdomen"
    - "(?i)abdo"
    - "(?i)\\bpelvis\\b"
    - "(?i)portal"
    - "(?i)venous"
    - "(?i)liver"
    - "(?i)\\bkub\\b"
    - "(?i)\\bbody\\b"

  # HU windows each scanned slice is rendered in. Each (slice × window) is one PNG.
  # SOFT-TISSUE ONLY for now (2026-07-10, per user): bone window dropped (dedicated
  # bone CT is rarely the use case here) and liver window dropped (its narrow level
  # is only useful on the subset of slices that actually contain liver — to revisit
  # later, ideally applied only to liver-bearing levels rather than the whole volume).
  #   soft-tissue / portal-venous (L40 W400): organs, masses, fluid, bowel, nodes
  windows:
    - {name: soft-tissue, level: 40.0, width: 400.0}

scan:
  # Windows scanned in the first (anomaly-flagging) pass — soft-tissue only for now.
  # Must be a subset of preprocessing.windows; falls back to the first window if empty.
  scan_windows:
    - soft-tissue
  # Images sent to MedGemma per scan call. The volume is scanned in ceil(N/batch_size)
  # calls PER scan window. Small batches keep the image→slice-index mapping reliable
  # and stop the model templating one finding across a whole batch. 2 is a good balance.
  batch_size: 2
  # MedGemma model tag for THIS use case, overriding the global MEDGEMMA_MODEL. ct2
  # uses 27B (more sensitive) for the scan; pet_ct etc. keep the global model. Empty →
  # global. (medgemma1.5 4B under-flagged badly here; 27B flags the correct regions.)
  model: "medgemma:27b"

report:
  # HU windows of the FLAGGED slices sent to the second (reporting) pass — soft-tissue
  # only, matching the scan. Only windows also in preprocessing.windows are usable.
  windows:
    - soft-tissue
  # Cap on flagged levels sent to the reporting pass. Single window now, so more levels
  # fit the context (~24 images at num_ctx 8192): 10 × 1 = 10 leaves ample headroom.
  max_report_levels: 10

# Tumour measurement (SAM-Med3D promptable segmentation). Localizes the flagged mass
# (TotalSegmentator organ-exclusion → residual core seed), segments it with SAM-Med3D
# using multiple interior click prompts, trims organ/CC leakage, and reports the
# bounding box × DICOM spacing as TS×AP×CC mm. AI-ESTIMATED (not caliper-grade); needs
# the SAM-Med3D weights + torchio in the worker — non-blocking, omitted on any failure.
measurement:
  enabled: true
  target_spacing: 1.0     # ROI isotropic mm; smaller bounds CC leak, larger adds context
  n_clicks: 12            # positive click prompts spread across the mass core
  mask_thresh: 0.45       # SAM-Med3D probability cut
  z_area_frac: 0.3        # keep contiguous z where slice area >= this × peak (trims leaks)
  hu_min: 20              # solid soft-tissue window for the seed (excludes ascites/fat)
  hu_max: 200

quality_checks:
  # Warn when the primary series has too few slices to scan meaningfully.
  min_slices: 10
