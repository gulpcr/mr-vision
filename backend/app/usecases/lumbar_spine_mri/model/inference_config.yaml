# lumbar_spine_mri configuration (MULTIPARAMETRIC MRI report family). No learned model. Every MR
# sequence is classified, co-registered onto one reference grid, and rendered as a labeled
# PANEL MONTAGE per axial level; MedGemma scans the montages to flag levels, then reports on
# the flagged ones. MRI has no absolute intensity scale (unlike CT HU), so each sequence tile
# uses a per-volume PERCENTILE window. Measurement is DISABLED (no validated MR segmentation).
preprocessing:
  edge_trim_fraction: 0.05
  # Intensity-relative foreground: keep a level only if at least this fraction of the
  # reference-sequence pixels sit above a low-percentile floor (drops near-empty air levels).
  min_foreground_fraction: 0.05
  max_scan_slices: 96
  preview_count: 6

  # Per-sequence percentile window (no HU): clip each sequence to [low_pct, high_pct] of its
  # own non-zero voxels so every tile is consistently windowed.
  window_low_pct: 1.0
  window_high_pct: 99.0

  # Panel-montage layout.
  tile_size: 448
  montage_cols: 3
  montage_max_size: 1536

  # Sequence classification catalogue (first matching entry wins per series; largest series
  # kept per sequence). A base_t1 series carrying a contrast marker is promoted to contrast_t1.
  base_t1: "T1"
  contrast_t1: "T1+C"
  contrast_patterns:
    - '(?i)post[\s_-]*contrast'
    - '(?i)post[\s_-]*gad'
    - '(?i)\+\s*c\b'
    - '(?i)\bc\s*\+'
    - '(?i)\bgad\b'
    - '(?i)\+\s*gd'
    - '(?i)\bgd\b'
    - '(?i)\bce\b'
    - '(?i)contrast'
    - '(?i)\bpost\b'
  sequences:
    - name: "STIR"
      patterns:
        - '(?i)stir'
        - '(?i)t2.*fs'
        - '(?i)fat[\s_-]*sat'
    - name: "T2"
      patterns:
        - '(?i)\bt2\b'
        - '(?i)t2w'
        - '(?i)t2[\s_-]*tse'
        - '(?i)\bspace\b'
        - '(?i)\bcube\b'
        - '(?i)ciss'
    - name: "T1"
      patterns:
        - '(?i)\bt1\b'
        - '(?i)t1w'
        - '(?i)t1[\s_-]*se'
  # Montage tile order (present sequences tiled + labeled in this order).
  sequence_order: ["T1", "T2", "STIR", "T1+C"]
  # Co-registration reference (first present wins; else the sequence with most slices).
  reference_preference: ["T2", "STIR", "T1"]
  # Reading plane(s): render a montage per slice in each plane (spine reads sagittal +
  # axial). Default is a single axial plane when omitted.
  reading_planes: ["sagittal", "axial"]


scan:
  batch_size: 2
  # MedGemma model tag for this use case (27B is more sensitive). Empty → global MEDGEMMA_MODEL.
  model: "medgemma:27b"

report:
  max_report_levels: 10

# Segmentation-verified LEVEL IDENTIFICATION (measurement.py). Runs TotalSegmentator's
# MR-native `vertebrae_mr` and states which lumbar levels (L1–L5 + S1) were imaged/resolved,
# as an objective scaffold the narrative is read against. It does NOT grade slip/stenosis/
# alignment — those could not be derived reliably from region masks on thick screening MR
# (see the RELIABILITY note in measurement.py); severity stays with the narrative pass.
measurement:
  enabled: true
  kind: spine_geometry              # hook dispatch key (spine branch)
  vertebra_task: vertebrae_mr       # per-level vertebrae + sacrum (MR-native)
  timeout_s: 1800
  min_level_voxels: 1500            # a level counts as solidly resolved above this
  partial_level_voxels: 150         # below solid but above this = partially imaged (FOV edge)

quality_checks:
  min_slices: 10
