services:
  # ========== Infrastructure ==========
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mri_platform}
      POSTGRES_USER: ${POSTGRES_USER:-mri_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mri_admin} -d ${POSTGRES_DB:-mri_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mri_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # ========== DICOM / PACS ==========
  orthanc:
    build: ./orthanc
    ports:
      - "4242:4242"
      - "8042:8042"
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    depends_on:
      - postgres

  # ========== Backend API (CPU — no GPU needed) ==========
  backend:
    build:
      context: ./backend
      target: api
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mri_admin}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-mri_platform}
      # The /api/debug/medgemma endpoints call Ollama from the BACKEND container,
      # so it needs the same host.docker.internal override as the worker (103.93.216.37
      # inside the container is the container itself). See worker service.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    command: >
      bash -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --reload
      "
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # ========== Celery Worker (GPU-accelerated) ==========
  worker:
    build:
      context: ./backend
      target: worker
    env_file: .env
    # TotalSegmentator's nnU-Net backend passes whole-body volumes between
    # preprocessing worker processes via /dev/shm; Docker's 64 MB default kills
    # them ("Background workers died"), which breaks physiologic-uptake suppression
    # and per-lesion structure labelling in the pet_ct pipeline. 8 GB is ample.
    shm_size: '8gb'
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mri_admin}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-mri_platform}
      # CUDA_VISIBLE_DEVICES is NOT set here — the image entrypoint
      # (docker/select-healthy-gpu.sh) real-compute-tests every GPU exposed
      # via NVIDIA_VISIBLE_DEVICES below and sets it dynamically to whichever
      # pass, so a wedged card degrades to "use the other one" automatically.
      - TOTALSEG_WEIGHTS_PATH=/model_cache/totalsegmentator
      - MONAI_HOME=/model_cache/monai
      - NVIDIA_VISIBLE_DEVICES=all
      # MedGemma runs on a LOCAL Ollama daemon on the host. Inside the container
      # "103.93.216.37" is the container itself, so the worker must reach the host via
      # host.docker.internal (verified: 103.93.216.37 → connection refused,
      # host.docker.internal → 200). Overridable via OLLAMA_BASE_URL in .env.
      # NB: the Ollama daemon must listen on 0.0.0.0 (OLLAMA_HOST=0.0.0.0:11434),
      # not just 127.0.0.1, or the container connection is refused.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # abdomen_ct4 Stage 1 loads the 4B MedGemma vision model from HuggingFace. MedGemma
      # is a GATED repo, so transformers/huggingface_hub need HF_TOKEN to download it
      # (put HF_TOKEN=hf_... in .env; resolved here, also passed via env_file). Not needed
      # once the weights are cached or when ABDOMEN_CT4_HF_TRIAGE_MODEL points at a local dir.
      - HF_TOKEN=${HF_TOKEN:-}
      # Persist the HF download (~9 GB) in the model_cache named volume so it survives
      # container recreation instead of re-downloading every `docker compose up`.
      - HF_HOME=/model_cache/huggingface
    # Linux (non-Docker-Desktop) hosts do not provide host.docker.internal by
    # default; this maps it to the host gateway. Harmless on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      # SpineNet code now lives in the build context (backend/external/spinenet).
      # Persist its auto-downloaded weights in a named volume so they survive
      # restarts and are not written into the host source tree.
      - spinenet_weights:/app/external/spinenet/spinenet/weights
      - model_bundles:/app/app/usecases/brain_mri/model/bundles
      - model_cache:/model_cache
    command: >
      celery -A app.infrastructure.queue.celery_app:celery_app worker
      --loglevel=info --concurrency=2 -Q mri_inference
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      backend:
        condition: service_started

  # ========== Celery Beat Scheduler (F15 Retention) ==========
  beat:
    build:
      context: ./backend
      target: api
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mri_admin}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-mri_platform}
    volumes:
      - ./backend:/app
    command: >
      celery -A app.infrastructure.queue.celery_app:celery_app beat
      --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ========== OHIF Viewer (F17) ==========
  ohif:
    image: ohif/app:latest
    ports:
      - "3001:80"
    environment:
      - APP_CONFIG=/usr/share/nginx/html/app-config.js
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    depends_on:
      - orthanc

  # ========== Frontend UI ==========
  ui:
    build: ./ui
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://103.93.216.37/api
      - NEXT_PUBLIC_DICOMWEB_URL=http://103.93.216.37/dicom-web
    depends_on:
      - backend

  # ========== Reverse Proxy ==========
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - ui
      - orthanc

volumes:
  postgres_data:
  redis_data:
  minio_data:
  orthanc_data:
  model_bundles:
  model_cache:
  spinenet_weights:
