# Security response headers for the TLS server (nginx/templates-tls). Included at server
# level AND inside every location that has its own add_header, because nginx only
# inherits add_header into a location that defines none of its own.
#
# HSTS without includeSubDomains/preload: tenant subdomains (TENANT_ROOT_DOMAIN) may not
# all be on HTTPS yet. Add them once every name under the domain is TLS-only.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Only frame-ancestors is enforced: the UI embeds the OHIF viewer (/ohif/) in a same-origin
# iframe, so 'self' must stay allowed. A full script/style CSP is not set here — OHIF
# needs inline scripts, eval-like WASM codecs and blob: workers; tighten per path later.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Drop upstream copies of the headers set above so responses never carry duplicates.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Powered-By;
