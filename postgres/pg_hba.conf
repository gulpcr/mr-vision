# Production client authentication (docker-compose.prod.yml). HIPAA 164.312(e):
# every network connection must be TLS; plaintext TCP is rejected outright.
#
# TYPE      DATABASE  USER  ADDRESS     METHOD
# Unix socket inside the container only (docker-entrypoint init scripts, pg_isready,
# `docker compose exec postgres psql`). Not reachable from the network.
local       all       all               trust
# pg_basebackup over the local socket (ops/backup.sh, nightly base backup for PITR).
local       replication all             trust
hostssl     all       all   0.0.0.0/0   scram-sha-256
hostssl     all       all   ::/0        scram-sha-256
hostnossl   all       all   0.0.0.0/0   reject
hostnossl   all       all   ::/0        reject
