# Production override — any Linux GPU host (see ops/deploy/README.md).
#
#   ops/deploy/up.sh                       (decrypts secrets, runs preflight, then:)
#   docker compose --env-file /run/mrcv/.env -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# REQUIRES Docker Compose >= v2.24.4 (`!reset` / `!override` clear or replace lists
# inherited from docker-compose.yml; older Compose silently MERGES them, which would
# re-publish internal ports and re-add the source bind mounts). Check with
# `docker compose ... config` before `up`.
#
# What this turns on versus the dev/live stack (HIPAA 164.312(a)(2)(iv), (e)):
#   In transit
#     * Every internal hop carrying PHI is TLS, verified against the internal CA from
#       ops/pki/make-certs.sh: Postgres (plaintext rejected by pg_hba), Redis (TLS port
#       only), MinIO, Orthanc REST/DICOMweb, nginx -> backend, Orthanc -> backend webhook.
#     * Public HTTPS by nginx (Let's Encrypt via certbot, or your own certificate).
#     * Scanner DICOM over mutual TLS on DICOM_PORT (default 2762); plain DICOM is not
#       published. Sites whose scanners cannot do TLS use the WireGuard tunnel instead
#       (DICOM_TLS_ENABLED=false, DICOM_BIND=<tunnel address>; ops/vpn/wireguard/).
#   At rest
#     * DICOM: Orthanc writes to MinIO through its S3 plugin, encrypting every file itself
#       (AES-256, ORTHANC storage master key) before upload; MinIO encrypts again (SSE-S3,
#       MINIO_KMS_SECRET_KEY). The Orthanc index (patient tags) moves from a SQLite file to
#       its own Postgres database over TLS.
#     * Artifacts: MinIO SSE-S3 on the artifact bucket.
#     * Everything else (Postgres, Redis, worker scratch, logs): the LUKS-encrypted Docker
#       data-root created by ops/deploy/bootstrap.sh. Backups: age-encrypted (ops/backup.sh).
#   Exposure
#     * Only 80/443 (nginx) and the DICOM port are published.
#     * Code from the built images, no source bind mounts, no uvicorn --reload.
#
# Host paths (created by ops/deploy/bootstrap.sh + ops/pki/make-certs.sh):
#   MRCV_PKI_DIR      /srv/mrcv/pki   internal CA + per-service certificates (on LUKS)
#   MRCV_RUNTIME_DIR  /run/mrcv       tmpfs: decrypted .env + Orthanc storage key
#   TLS_BYO_DIR       /srv/mrcv/tls   optional: your own public certificate
# Variables: see .env.example ("Production" section) — generated by ops/deploy/secrets-init.sh.

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

# Settings shared by backend, worker and beat.
x-prod-env: &prod-env
  # Served over HTTPS only: viewer cookie gets the Secure flag, CORS is the one origin.
  VIEWER_COOKIE_SECURE: "true"
  ALLOWED_ORIGINS: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
  ENFORCE_SECURE_CONFIG: "true"
  PRODUCTION_MODE: "true"
  # Refuse to start unless the DB role is bound by Row-Level Security (migration 044).
  REQUIRE_RLS: "true"
  # The browser session token lives only in an httpOnly cookie, never in JSON.
  ACCESS_TOKEN_IN_BODY: "false"
  # AI workers get de-identified studies (Safe Harbor boundary, infrastructure/orthanc/deidentify.py).
  PHI_DEIDENTIFY_ENABLED: "true"
  # No PHI before a BAA: tenants need an active BAA record (tenant_baas) to go live.
  REQUIRE_TENANT_BAA: "true"
  # Minimum necessary: the viewer gets only the DICOM attributes it displays.
  VIEWER_MINIMUM_NECESSARY: "true"
  # Monthly signed audit-log archive into the WORM (Object Lock) bucket.
  AUDIT_ARCHIVE_ENABLED: "true"
  # Every account must use MFA (forced enrolment at next sign-in), platform accounts too.
  MFA_REQUIRED_ROLES: "*"
  MFA_REQUIRED_FOR_PLATFORM: "true"
  API_DOCS_ENABLED: "false"
  # A native Linux host (or TRUSTED_PROXY_CIDRS behind a load balancer) gives nginx the
  # real client address, so the per-IP login limit can be strict.
  LOGIN_IP_ATTEMPTS_PER_MINUTE: "20"
  OLLAMA_BASE_URL: http://ollama:11434
  # ── TLS to every internal service (internal CA mounted at /run/pki/ca.crt) ──
  DB_SSL_MODE: verify-full
  DB_SSL_ROOT_CERT: /run/pki/ca.crt
  REDIS_TLS: "true"
  REDIS_CA_CERT: /run/pki/ca.crt
  CELERY_BROKER_URL: rediss://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: rediss://:${REDIS_PASSWORD}@redis:6379/1
  MINIO_SECURE: "true"
  MINIO_CA_CERT: /run/pki/ca.crt
  # The application's own MinIO user (artifact bucket only), never the MinIO root user.
  MINIO_ACCESS_KEY: ${MINIO_APP_USER:?set MINIO_APP_USER}
  MINIO_SECRET_KEY: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}
  ORTHANC_SCHEME: https
  ORTHANC_CA_CERT: /run/pki/ca.crt
  # Declarations checked by the startup guard (config.insecure_config_problems).
  MINIO_KMS_CONFIGURED: "true"
  ORTHANC_STORAGE_ENCRYPTED: "true"

x-pki-ca: &pki-ca ${MRCV_PKI_DIR:-/srv/mrcv/pki}/ca.crt:/run/pki/ca.crt:ro

services:
  # ========== Infrastructure: nothing published ==========
  postgres:
    <<: [*restart, *logging]
    ports: !reset []
    # TLS on, plaintext TCP rejected (postgres/pg_hba.conf). The wrapper copies the key
    # with the owner/mode Postgres insists on, then runs the image's own entrypoint.
    entrypoint: ["/bin/sh", "/opt/mrcv/tls-entrypoint.sh"]
    environment:
      # Forced WAL segment switch interval (seconds) — bounds the RPO.
      ARCHIVE_TIMEOUT: ${ARCHIVE_TIMEOUT:-300}
    volumes:
      - ./postgres/tls-entrypoint.sh:/opt/mrcv/tls-entrypoint.sh:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ${MRCV_PKI_DIR:-/srv/mrcv/pki}/postgres:/run/pki-src:ro
      # Continuous WAL archive (shipped off-site by wal-shipper; RPO <= 15 min).
      - wal_archive:/wal-archive

  # Ships every archived WAL segment off-site, age-encrypted (ops/wal-ship.sh).
  wal-shipper:
    image: ${WAL_SHIPPER_IMAGE:-alpine:3.20}
    <<: [*restart, *logging]
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache -q age rclone ca-certificates >/dev/null && exec /bin/sh /opt/mrcv/wal-ship.sh"]
    env_file:
      - ${MRCV_ENV_FILE:-.env}
    volumes:
      - ./ops/wal-ship.sh:/opt/mrcv/wal-ship.sh:ro
      - wal_archive:/wal-archive
      - *pki-ca
    depends_on:
      - postgres

  # One-shot: the database holding Orthanc's index (see orthanc below).
  pg-init:
    image: postgres:16-alpine
    restart: "no"
    <<: *logging
    entrypoint: ["/bin/sh", "/opt/mrcv/init-orthanc-db.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mri_platform}
      POSTGRES_USER: ${POSTGRES_USER:-mri_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      ORTHANC_DB_PASSWORD: ${ORTHANC_DB_PASSWORD:?set ORTHANC_DB_PASSWORD}
    volumes:
      - ./postgres/init-orthanc-db.sh:/opt/mrcv/init-orthanc-db.sh:ro
      - *pki-ca
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    <<: [*restart, *logging]
    ports: !reset []
    # TLS port only (--port 0 closes plaintext). Clients verify the server against the CA;
    # they authenticate with the password, not a client certificate.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /run/pki/redis/server.crt
      - --tls-key-file
      - /run/pki/redis/server.key
      - --tls-ca-cert-file
      - /run/pki/ca.crt
      - --tls-auth-clients
      - "no"
      - --tls-protocols
      - TLSv1.3
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/run/pki/ca.crt", "-h", "localhost", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ${MRCV_PKI_DIR:-/srv/mrcv/pki}/redis:/run/pki/redis:ro
      - *pki-ca

  minio:
    <<: [*restart, *logging]
    ports: !reset []
    command: server /data --console-address ":9001" --certs-dir /run/minio-certs
    environment:
      # Built-in KMS key for SSE-S3 ("<key-name>:<base64 32 bytes>"). Losing it makes every
      # object unreadable: it is in the SOPS secrets file and in the offline key escrow
      # (ops/KEYS.md).
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY}
    volumes:
      - ${MRCV_PKI_DIR:-/srv/mrcv/pki}/minio:/run/minio-certs:ro

  # One-shot: buckets + default encryption + least-privilege users (minio/init.sh).
  minio-init:
    # The MinIO server image ships `mc` (the separate minio/mc image is no longer published).
    image: ${MINIO_MC_IMAGE:-minio/minio:latest}
    restart: "no"
    <<: *logging
    entrypoint: ["/bin/sh", "/opt/mrcv/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mri_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MINIO_APP_USER: ${MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD}
      MINIO_ORTHANC_USER: ${MINIO_ORTHANC_USER:?set MINIO_ORTHANC_USER}
      MINIO_ORTHANC_PASSWORD: ${MINIO_ORTHANC_PASSWORD:?set MINIO_ORTHANC_PASSWORD}
      MINIO_BACKUP_USER: ${MINIO_BACKUP_USER:-}
      MINIO_BACKUP_PASSWORD: ${MINIO_BACKUP_PASSWORD:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-mri-artifacts}
      ORTHANC_S3_BUCKET: ${ORTHANC_S3_BUCKET:-orthanc-dicom}
      # mc (Go) verifies MinIO against the internal CA only.
      SSL_CERT_FILE: /run/pki/ca.crt
    volumes:
      - ./minio/init.sh:/opt/mrcv/minio-init.sh:ro
      - *pki-ca
    depends_on:
      - minio

  # ========== DICOM / PACS ==========
  orthanc:
    <<: [*restart, *logging]
    # Scanner DICOM only — mutual TLS by default. Orthanc HTTPS (8042) is not published.
    ports: !override
      - "${DICOM_BIND:-0.0.0.0}:${DICOM_PORT:-2762}:${DICOM_PORT:-2762}"
    environment:
      - ORTHANC__DICOM_PORT=${DICOM_PORT:-2762}
      - DICOM_TLS_ENABLED=${DICOM_TLS_ENABLED:-true}
      - ORTHANC_S3_BUCKET=${ORTHANC_S3_BUCKET:-orthanc-dicom}
      - MINIO_ORTHANC_USER=${MINIO_ORTHANC_USER}
      - MINIO_ORTHANC_PASSWORD=${MINIO_ORTHANC_PASSWORD}
      - ORTHANC_DB_PASSWORD=${ORTHANC_DB_PASSWORD}
      # Storage master keys: /run/mrcv/orthanc-keys (tmpfs), written by ops/deploy/up.sh
      # (rotation: ops/KEYS.md).
      - ORTHANC_WEBHOOK_URL=https://backend:8000/api/orthanc/notify-stable-study
      - BEFORE_ORTHANC_STARTUP_SCRIPT=/opt/mrcv/prod-startup.sh
    # No orthanc_data volume: DICOM files live (encrypted) in MinIO, the index in Postgres.
    volumes: !override
      - ./orthanc/orthanc.prod.json:/etc/orthanc/zz-prod.json:ro
      - ./orthanc/prod-startup.sh:/opt/mrcv/prod-startup.sh:ro
      - ${MRCV_PKI_DIR:-/srv/mrcv/pki}/orthanc:/run/pki/orthanc:ro
      - *pki-ca
      - ${MRCV_RUNTIME_DIR:-/run/mrcv}/orthanc-keys:/run/orthanc-keys:ro
      - ${MRCV_RUNTIME_DIR:-/run/mrcv}/orthanc-keys/storage-keys.json:/etc/orthanc/zz-storage-keys.json:ro
    depends_on: !override
      pg-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # ========== Application ==========
  backend:
    <<: [*restart, *logging]
    env_file: !override
      - ${MRCV_ENV_FILE:-.env}
    environment:
      <<: *prod-env
    # Image code only (no ./backend:/app bind mount, no --reload). Serves HTTPS with the
    # internal-PKI certificate; nginx verifies it. --proxy-headers makes request.url.scheme
    # https; the app takes the client IP from X-Real-IP (set by nginx), not X-Forwarded-For.
    volumes: !override
      - *pki-ca
      - ${MRCV_PKI_DIR:-/srv/mrcv/pki}/backend:/run/pki/backend:ro
    extra_hosts: !reset []
    ports: !reset []
    command: >
      bash -c "
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
        --ssl-certfile /run/pki/backend/server.crt --ssl-keyfile /run/pki/backend/server.key
        --proxy-headers --forwarded-allow-ips='*'
      "
    depends_on:
      ollama:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: [*restart, *logging]
    env_file: !override
      - ${MRCV_ENV_FILE:-.env}
    environment:
      <<: *prod-env
    extra_hosts: !reset []
    # Named volumes only — the source tree is baked into the image.
    volumes: !override
      - spinenet_weights:/app/external/spinenet/spinenet/weights
      - model_bundles:/app/app/usecases/brain_mri/model/bundles
      - model_cache:/model_cache
      - *pki-ca

  # Shadow (experimental-model) runs, isolated from clinical inference (alembic 056):
  # own queue, own process, concurrency 1. Results are comparison-only; the task skips
  # external AI, image storage, exports and every post-result hook. Enable with
  # AB_SHADOW_ENABLED=true and the "shadow" compose profile.
  worker-shadow:
    profiles: ["shadow"]
    extends:
      file: docker-compose.yml
      service: worker
    <<: [*restart, *logging]
    env_file: !override
      - ${MRCV_ENV_FILE:-.env}
    environment:
      <<: *prod-env
    extra_hosts: !reset []
    volumes: !override
      - spinenet_weights:/app/external/spinenet/spinenet/weights
      - model_bundles:/app/app/usecases/brain_mri/model/bundles
      - model_cache:/model_cache
      - *pki-ca
    command: >
      celery -A app.infrastructure.queue.celery_app:celery_app worker
      --loglevel=info --pool=threads --concurrency=1 -Q mri_shadow -n shadow@%h

  beat:
    <<: [*restart, *logging]
    env_file: !override
      - ${MRCV_ENV_FILE:-.env}
    environment:
      <<: *prod-env
    volumes: !override
      - *pki-ca

  ohif:
    <<: [*restart, *logging]
    ports: !reset []

  ui:
    <<: [*restart, *logging]
    ports: !reset []
    environment:
      - NEXT_PUBLIC_API_URL=https://${PUBLIC_DOMAIN}/api
      - NEXT_PUBLIC_DICOMWEB_URL=https://${PUBLIC_DOMAIN}/dicom-web

  # ========== MedGemma (local LLM, same host — no PHI leaves the machine) ==========
  ollama:
    <<: [*restart, *logging]
    # Pin to the tag you validated (`docker compose exec ollama ollama --version`).
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      # 1 = small KV cache; >1 spilled medgemma:27b onto the CPU (see project notes).
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama_models:/root/.ollama
    # No ports: reachable only as http://ollama:11434 on the compose network. Ollama has
    # no TLS; the hop never leaves the host (documented exception, ops/KEYS.md).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ========== Public HTTPS ==========
  nginx:
    <<: [*restart, *logging]
    # tini as PID 1: reaps the certificate watcher started by tls-entrypoint.sh.
    init: true
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      - ORTHANC_BASIC_AUTH=${ORTHANC_BASIC_AUTH:?set ORTHANC_BASIC_AUTH}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      # Empty = Let's Encrypt (certbot). Your own certificate: put fullchain.pem and
      # privkey.pem in TLS_BYO_DIR and set TLS_CERT_FILE=/etc/nginx/byo/fullchain.pem,
      # TLS_KEY_FILE=/etc/nginx/byo/privkey.pem (and drop the letsencrypt profile).
      - TLS_CERT_FILE=${TLS_CERT_FILE:-}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-}
      # Comma-separated CIDRs of a load balancer in front of nginx (empty = none).
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      # Public TLS versions; TLS 1.3 only unless a client cannot do it.
      - TLS_PROTOCOLS=${TLS_PROTOCOLS:-TLSv1.3}
      # awk regex over variable NAMES: substitute ${ORTHANC_*}, ${PUBLIC_DOMAIN}, ${TLS_*}.
      - NGINX_ENVSUBST_FILTER=ORTHANC_|PUBLIC_DOMAIN|TLS_
      - CERT_CHECK_INTERVAL=300
    entrypoint: ["/bin/sh", "/opt/mrcv/tls-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    volumes: !override
      - ./nginx/tls-entrypoint.sh:/opt/mrcv/tls-entrypoint.sh:ro
      - ./nginx/templates-tls:/etc/nginx/templates-tls:ro
      - ./nginx/templates-bootstrap:/etc/nginx/templates-bootstrap:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ${MRCV_PKI_DIR:-/srv/mrcv/pki}/ca.crt:/etc/nginx/pki/ca.crt:ro
      - ${TLS_BYO_DIR:-/srv/mrcv/tls}:/etc/nginx/byo:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

  siem:
    <<: [*restart, *logging]
    # Optional: ship security-relevant logs to a SIEM (ops/siem/vector.toml).
    # Enable with MRCV_COMPOSE_PROFILES=siem and SIEM_HTTP_URL / SIEM_HTTP_TOKEN.
    profiles: ["siem"]
    image: timberio/vector:0.41.1-alpine
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mrcv}
      SIEM_HTTP_URL: ${SIEM_HTTP_URL:-}
      SIEM_HTTP_TOKEN: ${SIEM_HTTP_TOKEN:-}
      VECTOR_DATA_DIR: /var/lib/vector
    volumes:
      - ./ops/siem/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - siem_buffer:/var/lib/vector
    command: ["--config", "/etc/vector/vector.toml"]

  certbot:
    <<: [*restart, *logging]
    # Let's Encrypt only; skipped when you bring your own certificate
    # (ops/deploy/up.sh enables this profile unless TLS_CERT_FILE is set).
    profiles: ["letsencrypt"]
    image: certbot/certbot:latest
    # First run: issues the certificate over the webroot challenge once DNS points here
    # (retries hourly while it fails — stays under Let's Encrypt's failed-validation
    # limit). Afterwards: `certbot renew` every 12 h (renews within 30 days of expiry).
    # nginx's watcher (nginx/tls-entrypoint.sh) reloads it when the files change.
    # CERTBOT_STAGING=1 uses the Let's Encrypt staging CA for dry runs.
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
      - CERTBOT_STAGING=${CERTBOT_STAGING:-0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        staging=""
        [ "$${CERTBOT_STAGING}" = "1" ] && staging="--staging"
        while :; do
          if [ -s "/etc/letsencrypt/live/$${PUBLIC_DOMAIN}/fullchain.pem" ]; then
            certbot renew --webroot -w /var/www/certbot --quiet --no-random-sleep-on-renew
            wait_s=43200
          else
            if certbot certonly --webroot -w /var/www/certbot -d "$${PUBLIC_DOMAIN}" \
                 --email "$${CERTBOT_EMAIL}" --agree-tos --no-eff-email \
                 --non-interactive --keep-until-expiring $${staging}; then
              wait_s=43200
            else
              echo "certbot: issuance failed (DNS not pointed yet?) - retrying in 1h" >&2
              wait_s=3600
            fi
          fi
          sleep "$${wait_s}" & wait $$!
        done
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  wal_archive:
  siem_buffer:
  ollama_models:
  certbot_conf:
  certbot_www:
